---
name: "test_chdb"

# Runs the integration suite against embedded chDB (driver: chdb) — no
# ClickHouse server, no Docker, no service containers. Requires
# clickhouse-connect>=1.6.0, whose [chdb] extra ships the built-in embedded
# chDB backend and pulls in the chdb engine package.

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: main
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} | chDB embedded | Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install requirements
        run: pip3 install ".[chdb]" -r dev_requirements.txt

      - name: Run tests against embedded chDB
        env:
          DBT_CH_TEST_DRIVER: chdb
        run: |
          PYTHONPATH="${PYTHONPATH}:dbt"
          pytest tests/integration --timeout=120
