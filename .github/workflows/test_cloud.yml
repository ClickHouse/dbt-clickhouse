---
name: "test_cloud"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: main
    paths-ignore:
      - 'docs/**'
  # Fork PRs get no secrets on pull_request; a maintainer runs them by adding the label.
  pull_request_target:
    branches: main
    types: [labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # Nightly run at 4:00 AM UTC

permissions:
  contents: read

jobs:
  cloud_smt_tests:
    name: ClickHouse Cloud SharedMergeTree Tests
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'tests:run-cloud' &&
        github.event.pull_request.head.repo.full_name != github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      PYTHONPATH: dbt
      DBT_CH_TEST_HOST: ${{ secrets.CONNECTORS_TEAM_TESTS_CLOUD_HOST }}
      DBT_CH_TEST_PASSWORD: ${{ secrets.CONNECTORS_TEAM_TESTS_CLOUD_PASSWORD }}
      DBT_CH_TEST_CLUSTER_MODE: true
      DBT_CH_TEST_CLOUD: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # head.sha is fixed at label time, so later pushes need a fresh label.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          # Fork code runs with secrets. a maintainer must review it before labeling.
          # See https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          pip3 install --upgrade pip
          pip3 install . --group dev

      # --dist loadscope: run test classes concurrently on xdist workers
      # (loadscope is required — the project/schema fixtures are class-scoped).
      - name: Run HTTP tests
        env:
          DBT_CH_TEST_PORT: 8443
        run: pytest tests -n 2 --dist loadscope --timeout=300

      - name: Run Native tests
        env:
          DBT_CH_TEST_PORT: 9440
        run: pytest tests -n 2 --dist loadscope --timeout=300

  # Consume the label so new commits need a fresh review and re-label to run.
  # Separate job keeps the write token away from fork code.
  remove_run_cloud_label:
    name: Remove tests:run-cloud label
    needs: cloud_smt_tests
    if: always() && github.event_name == 'pull_request_target' && needs.cloud_smt_tests.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/tests%3Arun-cloud" || true
