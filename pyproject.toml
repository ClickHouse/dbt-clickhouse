[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-clickhouse"
dynamic = ["version"]
description = "The Clickhouse plugin for dbt (data build tool)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "ClickHouse Inc.", email = "guy@clickhouse.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "dbt-adapters>=1.22.0,<1.25.0",  # This version should be dbt-adapters<2.0, but keeping it fixed for now to avoid unexpected issues. We need to frequently update it.
    # installed via dbt-adapters but used directly
    "dbt-common>=1.36,<2.0",
    "agate>=1.0,<2.0",
    # add dbt-core to ensure backwards compatibility of installation, this is not a functional dependency
    "dbt-core>=1.9,<2.0",
    "clickhouse-connect>=0.10.0",
    "clickhouse-driver>=0.2.10"
]

[project.urls]
Homepage = "https://github.com/ClickHouse/dbt-clickhouse"
Repository = "https://github.com/ClickHouse/dbt-clickhouse"
Issues = "https://github.com/ClickHouse/dbt-clickhouse/issues"
Documentation = "https://github.com/ClickHouse/dbt-clickhouse#documentation"
"ClickHouse Docs" = "https://clickhouse.com/docs/integrations/dbt"
Changelog = "https://github.com/ClickHouse/dbt-clickhouse/blob/main/CHANGELOG.md"
Slack = "https://clickhouse.com/slack"

[dependency-groups]
dev = [
    "dbt-core==1.12.*",
    "dbt-tests-adapter>=1.10,<2.0",
    "pytest>=7.2.0",
    "pytest-dotenv==0.5.2",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.0",
    "mypy==1.19.1",
    "yamllint==1.37.1",
    "requests~=2.34.2",
]

[tool.setuptools]
packages = {find = {include = ["dbt", "dbt.*"], namespaces = true}}

[tool.setuptools.package-data]
"dbt.include.clickhouse" = [
    "dbt_project.yml",
    "macros/*.sql",
    "macros/**/*.sql",
]

[tool.setuptools.dynamic]
version = {attr = "dbt.adapters.clickhouse.__version__.version"}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # isort (import sorting)
    "W", # pycodestyle warnings
    "B", # flake8-bugbear
]
ignore = [
    "E501", # Line too long (> 100 characters)
]

[tool.ruff.lint.isort]
known-third-party = [
    "dbt",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
